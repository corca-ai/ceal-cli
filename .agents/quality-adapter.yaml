version: 1
repo: ceal-cli
language: en
output_dir: charness-artifacts/quality
preset_id: portable-defaults
customized_from: portable-defaults
preset_lineage:
  - typescript-quality
  - monorepo-quality
coverage_fragile_margin_pp: 1.0
coverage_floor_policy:
  min_statements_threshold: 30
  fail_below_pct: 80.0
  warn_ceiling_pct: 95.0
  floor_drift_lock_pp: 1.0
  exemption_list_path: scripts/coverage-floor-exemptions.txt
  gate_script_pattern: "*-quality-gate.sh"
  lefthook_path: lefthook.yml
  ci_workflow_glob: .github/workflows/*.yml
specdown_smoke_patterns: []
recommendation_defaults_version: issue-64
public_spec_section_exemptions:
  - Fixed Decisions
  - HTTP API contract
  - Server backend stack
  - Deferred Decisions
  - Non-Goals
public_spec_implementation_ref_density_floor: 0.02
public_spec_implementation_guard_min_lines: 100
public_spec_pointer_proof_markers:
  - "proof: pointer"
  - "proof: pointer-spec"
  - "executable_proof: pointer"
  - "public_spec_proof: pointer"
cli_skill_surface_probe_commands:
  - npm run probe
canonical_markdown_surfaces:
  - AGENTS.md
  - CLAUDE.md
prompt_asset_policy:
  source_globs: []
  min_multiline_chars: 400
  exemption_globs: []
skill_ergonomics_gate_rules:
  - code_fence_without_helper_script
  - dated_incident_in_core
  - issue_anchor_in_core
  - long_core
  - mode_option_pressure_terms
  - portable_package_dated_incident
  - portable_package_issue_anchor
  - portable_helper_path_ambiguity
  - progressive_disclosure_risk
skill_ergonomics_skill_paths:
  - skills/ceal-guide/SKILL.md
runtime_profile_default: default
# The worker CLI is invoked by an agent once per step, so process start is a real
# cost centre and not a micro-benchmark. `--help` is the cheapest route that
# still pays the whole bootstrap: argv parse, command table, help render. Marked
# `warm` on purpose — the process is new each sample but the page cache is not,
# so this measures the repeat-invocation cost an agent actually pays. It reads
# gitignored `dist/`, so it fails loud on a fresh clone until `npm run build`.
startup_probes:
  - label: ceal --help process start
    class: standing
    surface: worker-cli
    startup_mode: warm
    samples: 5
    timeout_seconds: 30
    command:
      - node
      - packages/ceal-worker-cli/dist/bin.js
      - --help
concept_paths:
  - README.md
  - docs/handoff.md
  - docs/operator-acceptance.md
  - charness-artifacts/quality/latest.md
# Boy-scout duplicate ratchet. The hard arm blocks a NEW fixable clone family;
# the boy-scout arm nudges the reviewed ceiling down. Scope is the code this repo
# actually owns — `packages/ceal-protocol` is a vendored copy this lane may not
# edit, so linting its duplication would surface findings nobody here can act on,
# the same reason biome excludes it.
dup_ratchet:
  enabled: true
  floor_F: 0
  escalation_K: 10
  scope_paths:
    - scripts
    - packages/ceal-client/src
    - packages/ceal-worker-cli/src
    - test
  # Tracked, not `.charness/`: that path is gitignored, and the boy-scout arm
  # measures stagnation from the commit that last touched the overlay. An
  # untracked overlay has no anchor and no life outside one clone.
  review_artifact_path: charness-artifacts/quality/dup-review.json
  gate_baseline_path: charness-artifacts/quality/dup-ratchet-baseline.json
gate_commands:
  - npm run check:unit
  - npm run check
# `.githooks/pre-push` writes this log on every push, so the runtime helpers read
# what a real host measured instead of a figure typed into a doc. AGENTS.md makes
# that a rule; this is where the rule gets a machine-readable home.
command_timing_log:
  path: .charness/quality/command-timing.jsonl
  format: jsonl
  elapsed_unit: ms
  recent_window: 10
  field_map:
    label: label
    elapsed: elapsed_ms
# Closes quality_adapter.review_fields_missing. Empty is the honest state: no
# adapter review has been sourced or acknowledged yet.
adapter_review_sources: []
acknowledged_recommendations: []
gate_design_review_globs:
  - .github/workflows/*.yml
  - .githooks/*
  - package.json
