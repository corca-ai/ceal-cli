name: Check

# The release workflows in this directory trigger only on tags, so before this
# lane existed the first CI run for any change was its release run — and a
# failed release tag cannot be reused. This gate runs the same `npm run check`
# a maintainer runs locally, on every push to main and every pull request, so a
# break is found while it is still cheap to fix.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    # linux-x64: the release-artifact and installer suites gate themselves on
    # this platform, so any other runner would report green while skipping the
    # real-binary and real-installer proofs entirely.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # .nvmrc is the single Node pin. A range from engines.node would let this
      # gate resolve a different major than the release lane builds on, so a
      # green check would not predict a green release.
      - name: Install the pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly the locked dependency set
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `npm run check` is not self-sufficient on a cold runner: the packed
      # consumer proofs install from the npm cache with --offline, so an
      # unprewarmed runner fails them as ENOTCACHED rather than as a defect.
      # The release lane does this too; both must, or they are not the same gate.
      - name: Prewarm the offline packed-consumer cache
        run: node scripts/prewarm-offline-consumer-cache.mjs

      # The hook installer is proven inside this gate by test/repo-gates.test.mjs,
      # against a throwaway clone rather than this checkout, so there is no
      # separate CI step re-proving the same seam.
      # This runner is linux-x64, so the real-binary and installer proofs must
      # actually run here. Without this they skip themselves and CI stays green
      # having proved no installed binary at all.
      - name: Run the full gate
        run: npm run check
        env:
          CEAL_REQUIRE_PLATFORM_PROOFS: "1"
