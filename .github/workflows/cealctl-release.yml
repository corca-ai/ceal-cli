name: Ceal CLI release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test source
        run: npm run check
      - name: Rebuild and package the checked candidate twice
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          version="${TAG#v}"
          for output in dist-a dist-b; do
            node scripts/build-platform-binaries.mjs \
              --version "$version" \
              --platform "$PLATFORM" \
              --out "$output" \
              --json
          done
          for asset in \
            "ceal-$PLATFORM" \
            "cealctl-$PLATFORM" \
            ceal-cli-platform-release-manifest.json \
            ceal-guide-SKILL.md cealctl-guide-SKILL.md \
            THIRD_PARTY_NOTICES.txt \
            SHA256SUMS
          do
            cmp "dist-a/$asset" "dist-b/$asset"
          done
      - name: Preserve exact unprivileged build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-cli-release-${{ github.sha }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist-a/ceal-${{ matrix.platform }}
            dist-a/cealctl-${{ matrix.platform }}
            dist-a/ceal-cli-platform-release-manifest.json
            dist-a/ceal-guide-SKILL.md
            dist-a/cealctl-guide-SKILL.md
            dist-a/THIRD_PARTY_NOTICES.txt
            dist-a/SHA256SUMS

  assemble:
    needs: build
    permissions:
      contents: read
    outputs:
      sha256sums_sha256: ${{ steps.release-set.outputs.sha256sums_sha256 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact tag for installer asset
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download exact arm64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-cli-release-${{ github.sha }}-linux-arm64
          path: handoff/linux-arm64
      - name: Download exact amd64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-cli-release-${{ github.sha }}-linux-amd64
          path: handoff/linux-amd64
      - name: Assemble one dual-platform release set
        id: release-set
        run: |
          set -eu
          mkdir dist
          for platform in linux-arm64 linux-amd64; do
            source="handoff/$platform"
            [ "$(find "$source" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')" = \
              "SHA256SUMS THIRD_PARTY_NOTICES.txt ceal-cli-platform-release-manifest.json ceal-guide-SKILL.md ceal-$platform cealctl-guide-SKILL.md cealctl-$platform " ] \
              || { echo "Unexpected $platform build handoff inventory" >&2; exit 1; }
            (cd "$source" && sha256sum -c SHA256SUMS)
            cp "$source/ceal-$platform" "$source/cealctl-$platform" dist/
            cp "$source/ceal-cli-platform-release-manifest.json" \
              "dist/ceal-cli-platform-release-manifest-$platform.json"
          done
          cmp handoff/linux-arm64/THIRD_PARTY_NOTICES.txt handoff/linux-amd64/THIRD_PARTY_NOTICES.txt
          cp handoff/linux-arm64/THIRD_PARTY_NOTICES.txt dist/
          for guide in ceal-guide-SKILL.md cealctl-guide-SKILL.md; do
            cmp "handoff/linux-arm64/$guide" "handoff/linux-amd64/$guide"
            cp "handoff/linux-arm64/$guide" dist/
          done
          cp install.sh dist/
          (cd dist && sha256sum \
            THIRD_PARTY_NOTICES.txt \
            ceal-cli-platform-release-manifest-linux-amd64.json \
            ceal-cli-platform-release-manifest-linux-arm64.json \
            ceal-guide-SKILL.md cealctl-guide-SKILL.md \
            ceal-linux-amd64 ceal-linux-arm64 \
            cealctl-linux-amd64 cealctl-linux-arm64 \
            install.sh > SHA256SUMS)
          digest="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          echo "sha256sums_sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Unprivileged dual-platform release handoff"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- SHA256SUMS digest for environment approval: $digest"
            echo "- artifact: ceal-cli-release-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact unprivileged dual-platform release handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-cli-release-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: dist/

  sign-and-draft:
    needs: assemble
    environment: ceal-cli-release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact approved release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-cli-release-${{ github.sha }}
          path: dist
      - name: Require operator-approved release identity
        env:
          APPROVED_COMMIT: ${{ vars.CEAL_CLI_APPROVED_COMMIT }}
          APPROVED_SHA256SUMS_SHA256: ${{ vars.CEAL_CLI_APPROVED_SHA256SUMS_SHA256 }}
          ASSEMBLED_SHA256SUMS_SHA256: ${{ needs.assemble.outputs.sha256sums_sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          [ -n "$APPROVED_COMMIT" ] && [ "$APPROVED_COMMIT" = "$GITHUB_SHA" ] \
            || { echo "The ceal-cli-release environment has not approved commit $GITHUB_SHA" >&2; exit 1; }
          observed="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          [ -n "$ASSEMBLED_SHA256SUMS_SHA256" ] && [ "$ASSEMBLED_SHA256SUMS_SHA256" = "$observed" ] \
            || { echo "Downloaded handoff does not match unprivileged assembly $ASSEMBLED_SHA256SUMS_SHA256" >&2; exit 1; }
          [ -n "$APPROVED_SHA256SUMS_SHA256" ] && [ "$APPROVED_SHA256SUMS_SHA256" = "$observed" ] \
            || { echo "The ceal-cli-release environment has not approved SHA256SUMS $observed" >&2; exit 1; }
          [ "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = \
            "SHA256SUMS THIRD_PARTY_NOTICES.txt ceal-cli-platform-release-manifest-linux-amd64.json ceal-cli-platform-release-manifest-linux-arm64.json ceal-guide-SKILL.md cealctl-guide-SKILL.md ceal-linux-amd64 ceal-linux-arm64 cealctl-linux-amd64 cealctl-linux-arm64 install.sh " ] \
            || { echo "Unexpected build handoff inventory" >&2; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          for platform in linux-arm64 linux-amd64; do
            manifest="dist/ceal-cli-platform-release-manifest-$platform.json"
            grep -F "\"release_version\": \"${TAG#v}\"" "$manifest" >/dev/null
            grep -F "\"platform\": \"$platform\"" "$manifest" >/dev/null
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Reconcile one exact signed draft inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          primary=(
            ceal-linux-arm64 cealctl-linux-arm64
            ceal-linux-amd64 cealctl-linux-amd64
            ceal-cli-platform-release-manifest-linux-arm64.json
            ceal-cli-platform-release-manifest-linux-amd64.json
            ceal-guide-SKILL.md cealctl-guide-SKILL.md
            THIRD_PARTY_NOTICES.txt SHA256SUMS install.sh
          )
          expected=()
          for asset in "${primary[@]}"; do
            expected+=("$asset" "$asset.pem" "$asset.sig")
          done
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true ] \
              || { echo "Existing release is not a draft" >&2; exit 1; }
          else
            gh release create "$TAG" --repo "$GH_REPO" --draft --verify-tag --title "Ceal CLI $TAG"
          fi

          existing_inventory="$(mktemp)"
          gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' > "$existing_inventory"
          mapfile -t existing < <(sort "$existing_inventory")
          if [ "${#existing[@]}" -gt 0 ]; then
            if ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${existing[@]}"); then
              echo "Draft asset inventory is partial or unexpected; delete and recreate the draft after review, then rerun." >&2
              exit 1
            fi
          else
            for asset in "${primary[@]}"; do
              cosign sign-blob --yes \
                --output-signature "dist/$asset.sig" \
                --output-certificate "dist/$asset.pem" \
                "dist/$asset"
            done
            gh release upload "$TAG" --repo "$GH_REPO" dist/*
          fi

          rm -rf readback
          mkdir readback
          gh release download "$TAG" --repo "$GH_REPO" --dir readback
          mapfile -t observed < <(find readback -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${observed[@]}")
          identity="https://github.com/$GH_REPO/.github/workflows/cealctl-release.yml@refs/tags/$TAG"
          for asset in "${primary[@]}"; do
            cmp "dist/$asset" "readback/$asset"
            cosign verify-blob \
              --certificate "readback/$asset.pem" \
              --signature "readback/$asset.sig" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "$GH_REPO" \
              --certificate-github-workflow-ref "refs/tags/$TAG" \
              "readback/$asset" >/dev/null
          done
          {
            echo "## Ceal CLI draft evidence"
            echo
            echo "- tag: $TAG"
            echo "- commit/workflow source: $GITHUB_SHA"
            echo "- runner: $RUNNER_OS/$RUNNER_ARCH"
            echo "- approved SHA256SUMS digest: $(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
            echo "- exact draft asset inventory: ${expected_sorted[*]}"
            echo "- remote primary bytes: exact local match"
            echo "- remote signature identity: verified"
          } >> "$GITHUB_STEP_SUMMARY"
