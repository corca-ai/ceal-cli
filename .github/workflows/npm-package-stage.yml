name: Ceal npm package stage

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  stage:
    environment: ceal-npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out exact tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install the staged-publish npm client
        run: npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
      - name: Install and verify exact source
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          [ "$(npm --version)" = "11.18.0" ]
      - name: Require approved post-bootstrap release identity
        env:
          APPROVED_COMMIT: ${{ vars.CEAL_NPM_APPROVED_COMMIT }}
          APPROVED_CLIENT_SHA256: ${{ vars.CEAL_NPM_APPROVED_CLIENT_SHA256 }}
          APPROVED_PROTOCOL_SHA256: ${{ vars.CEAL_NPM_APPROVED_PROTOCOL_SHA256 }}
          APPROVED_VERSION: ${{ vars.CEAL_NPM_APPROVED_VERSION }}
          BOOTSTRAP_COMPLETE: ${{ vars.CEAL_NPM_BOOTSTRAP_COMPLETE }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          [ "$BOOTSTRAP_COMPLETE" = "true" ] \
            || { echo "The first direct 2FA bootstrap must finish before staged publishing is enabled." >&2; exit 1; }
          [ -n "$APPROVED_COMMIT" ] && [ "$APPROVED_COMMIT" = "$GITHUB_SHA" ] \
            || { echo "The ceal-npm-release environment has not approved commit $GITHUB_SHA" >&2; exit 1; }
          [ -n "$APPROVED_VERSION" ] && [ "$APPROVED_VERSION" = "$version" ] \
            || { echo "The ceal-npm-release environment has not approved version $version" >&2; exit 1; }
          [ -n "$APPROVED_PROTOCOL_SHA256" ] && [ -n "$APPROVED_CLIENT_SHA256" ] \
            || { echo "The ceal-npm-release environment has not approved both package digests." >&2; exit 1; }
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = process.argv[1];
            const protocol = JSON.parse(readFileSync("packages/ceal-protocol/package.json", "utf8"));
            const client = JSON.parse(readFileSync("packages/ceal-client/package.json", "utf8"));
            if (protocol.name !== "@corca-ai/ceal-protocol" || client.name !== "@corca-ai/ceal") process.exit(1);
            if (protocol.version !== version || client.version !== version) process.exit(1);
            if (client.dependencies?.["@corca-ai/ceal-protocol"] !== version) process.exit(1);
          ' "$version"
      - name: Pack and verify the exact approved package pair
        env:
          APPROVED_CLIENT_SHA256: ${{ vars.CEAL_NPM_APPROVED_CLIENT_SHA256 }}
          APPROVED_PROTOCOL_SHA256: ${{ vars.CEAL_NPM_APPROVED_PROTOCOL_SHA256 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          mkdir npm-stage-inputs npm-stage-results
          (cd packages/ceal-protocol && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/npm-stage-inputs")
          (cd packages/ceal-client && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/npm-stage-inputs")
          protocol="npm-stage-inputs/corca-ai-ceal-protocol-${version}.tgz"
          client="npm-stage-inputs/corca-ai-ceal-${version}.tgz"
          [ "$(sha256sum "$protocol" | cut -d' ' -f1)" = "$APPROVED_PROTOCOL_SHA256" ] \
            || { echo "Protocol tarball differs from the approved digest." >&2; exit 1; }
          [ "$(sha256sum "$client" | cut -d' ' -f1)" = "$APPROVED_CLIENT_SHA256" ] \
            || { echo "Client tarball differs from the approved digest." >&2; exit 1; }
      - name: Stage the exact approved package pair
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          release_tag="candidate-${version//./-}"
          npm stage publish "npm-stage-inputs/corca-ai-ceal-protocol-${version}.tgz" \
            --tag "$release_tag" --provenance | tee npm-stage-results/protocol.txt
          npm stage publish "npm-stage-inputs/corca-ai-ceal-${version}.tgz" \
            --tag "$release_tag" --provenance | tee npm-stage-results/client.txt
          {
            echo "## Ceal npm staged package evidence"
            echo
            echo "- commit/workflow source: $GITHUB_SHA"
            echo "- version: $version"
            echo "- temporary tag: $release_tag"
            echo "- staged packages: @corca-ai/ceal-protocol, @corca-ai/ceal"
            echo "- promotion: requires separate human 2FA approval and registry readback"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact inputs and partial-stage recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-npm-stage-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            npm-stage-inputs/
            npm-stage-results/
