name: Ceal worker stable rollback

# This never rebuilds, signs, or changes a versioned object. It moves the
# mutable worker pointer only after re-verifying the selected immutable public
# release inventory. The literal confirmation keeps rollback distinct from a
# tag-triggered release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Previously published canonical worker tag (ceal-vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      confirmation:
        description: "Type ROLLBACK to replace the stable pointer"
        required: true
        type: string

permissions: {}

concurrency:
  group: ceal-worker-release-origin
  cancel-in-progress: false

env:
  CEAL_RELEASE_ORIGIN: https://ceal.borca.ai/releases
  CEAL_RELEASE_BUCKET: ceal-release

jobs:
  verify:
    if: ${{ inputs.confirmation == 'ROLLBACK' }}
    permissions:
      contents: read
    # Rollback is the lane reached when a release is already wrong; a wedged
    # one holds the bad release live for the 6-hour default.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      sha256sums_sha256: ${{ steps.handoff.outputs.sha256sums_sha256 }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out inventory verifier
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Re-verify an immutable worker release
        id: handoff
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^ceal-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Worker rollback tag must be canonical ceal-vMAJOR.MINOR.PATCH"; exit 1; }
          readback_dir="$RUNNER_TEMP/ceal-worker-rollback-readback"
          mkdir -p "$readback_dir"
          version_url="$CEAL_RELEASE_ORIGIN/worker/$TAG"
          identity="https://github.com/corca-ai/ceal-cli/.github/workflows/ceal-release.yml@refs/tags/$TAG"
          # Verify the signed inventory itself before it is allowed to name any
          # later URL. The parser then accepts only shared assets and complete
          # pairs from the bounded historical platform vocabulary, so rollback
          # can validate an older four-platform tag and a future three-platform
          # tag without treating arbitrary signed names as writer authority.
          for asset in SHA256SUMS; do
            curl --fail --silent --show-error --location "$version_url/$asset" --output "$readback_dir/$asset"
            curl --fail --silent --show-error --location "$version_url/$asset.sig" --output "$readback_dir/$asset.sig"
            curl --fail --silent --show-error --location "$version_url/$asset.pem" --output "$readback_dir/$asset.pem"
          done
          cosign verify-blob \
            --certificate "$readback_dir/SHA256SUMS.pem" \
            --signature "$readback_dir/SHA256SUMS.sig" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "corca-ai/ceal-cli" \
            --certificate-github-workflow-ref "refs/tags/$TAG" \
            "$readback_dir/SHA256SUMS" >/dev/null
          # Assigned first, then read. `set -e` does not see the exit status of a
          # command inside a process substitution, so `mapfile < <(node ...)` turns
          # a `published_inventory_malformed` refusal into an empty array and the
          # job fails later with missing-file noise about assets it never fetched.
          # The parser's whole job is to name what is wrong with a published
          # inventory; swallowing that mid-rollback points the operator at the
          # network instead. Same rule as the pipefail one in AGENTS.md
          # `## Conventions`, at the sibling construct it did not name.
          inventory_listing="$(
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parsePublishedWorkerReleaseInventory } from "./scripts/build-worker-release-assets.mjs";
              for (const asset of parsePublishedWorkerReleaseInventory(readFileSync(process.argv[1], "utf8"))) console.log(asset);
            ' "$readback_dir/SHA256SUMS"
          )"
          mapfile -t inventory_assets <<< "$inventory_listing"
          primary=(SHA256SUMS "${inventory_assets[@]}")
          for asset in "${inventory_assets[@]}"; do
            curl --fail --silent --show-error --location "$version_url/$asset" --output "$readback_dir/$asset"
            curl --fail --silent --show-error --location "$version_url/$asset.sig" --output "$readback_dir/$asset.sig"
            curl --fail --silent --show-error --location "$version_url/$asset.pem" --output "$readback_dir/$asset.pem"
          done
          (cd "$readback_dir" && sha256sum -c SHA256SUMS)
          for asset in "${primary[@]}"; do
            cosign verify-blob \
              --certificate "$readback_dir/$asset.pem" \
              --signature "$readback_dir/$asset.sig" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "corca-ai/ceal-cli" \
              --certificate-github-workflow-ref "refs/tags/$TAG" \
              "$readback_dir/$asset" >/dev/null
          done
          stable_dir="$RUNNER_TEMP/ceal-worker-stable"
          mkdir -p "$stable_dir"
          cp "$readback_dir/install-ceal.sh" "$stable_dir/install-ceal.sh"
          cp "$readback_dir/SHA256SUMS" "$stable_dir/SHA256SUMS"
          release_set_sha="$(sha256sum "$readback_dir/SHA256SUMS" | cut -d' ' -f1)"
          printf '{"schema_version":"ceal.worker_stable_release.v1","tag":"%s","sha256sums_sha256":"%s"}\n' "$TAG" "$release_set_sha" > "$stable_dir/ceal-worker-stable-release.json"
          echo "sha256sums_sha256=$release_set_sha" >> "$GITHUB_OUTPUT"
      - name: Preserve the verified rollback handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-rollback-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/ceal-worker-stable/

  activate:
    needs: verify
    environment: ceal-cli-release
    permissions:
      actions: read
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CEAL_ENV_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CEAL_ENV_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require approved rollback workflow identity
        env:
          APPROVED_COMMIT: ${{ vars.CEAL_CLI_APPROVED_COMMIT }}
          APPROVED_SHA256SUMS_SHA256: ${{ vars.CEAL_CLI_APPROVED_SHA256SUMS_SHA256 }}
          VERIFIED_SHA256SUMS_SHA256: ${{ needs.verify.outputs.sha256sums_sha256 }}
        run: |
          set -euo pipefail
          [ -n "$APPROVED_COMMIT" ] && [ "$APPROVED_COMMIT" = "$GITHUB_SHA" ] \
            || { echo "::error::ceal-cli-release has not approved rollback workflow commit $GITHUB_SHA"; exit 1; }
          [ -n "$APPROVED_SHA256SUMS_SHA256" ] \
            && [ "$APPROVED_SHA256SUMS_SHA256" = "$VERIFIED_SHA256SUMS_SHA256" ] \
            || { echo "::error::ceal-cli-release has not approved the verified rollback inventory"; exit 1; }
      - name: Download the verified rollback handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-rollback-${{ github.sha }}
          path: stable
      - name: Require the approved rollback identity
        env:
          APPROVED_COMMIT: ${{ vars.CEAL_CLI_APPROVED_COMMIT }}
          APPROVED_SHA256SUMS_SHA256: ${{ vars.CEAL_CLI_APPROVED_SHA256SUMS_SHA256 }}
          VERIFIED_SHA256SUMS_SHA256: ${{ needs.verify.outputs.sha256sums_sha256 }}
        run: |
          set -euo pipefail
          pointer_digest="$(node -p 'JSON.parse(require("node:fs").readFileSync("stable/ceal-worker-stable-release.json", "utf8")).sha256sums_sha256')"
          pointer_tag="$(node -p 'JSON.parse(require("node:fs").readFileSync("stable/ceal-worker-stable-release.json", "utf8")).tag')"
          observed_digest="$(sha256sum stable/SHA256SUMS | cut -d' ' -f1)"
          expected_installer="$(awk '$2 == "install-ceal.sh" { print $1 }' stable/SHA256SUMS)"
          observed_installer="$(sha256sum stable/install-ceal.sh | cut -d' ' -f1)"
          [ "$pointer_tag" = "$TAG" ] \
            || { echo "::error::Downloaded rollback handoff names $pointer_tag instead of $TAG"; exit 1; }
          [ -n "$APPROVED_SHA256SUMS_SHA256" ] && [ "$APPROVED_SHA256SUMS_SHA256" = "$observed_digest" ] \
            || { echo "::error::ceal-cli-release has not approved rollback SHA256SUMS $observed_digest"; exit 1; }
          [ "$VERIFIED_SHA256SUMS_SHA256" = "$observed_digest" ] && [ "$pointer_digest" = "$observed_digest" ] \
            || { echo "::error::Downloaded rollback handoff differs from the verified inventory"; exit 1; }
          [[ "$expected_installer" =~ ^[a-f0-9]{64}$ ]] && [ "$expected_installer" = "$observed_installer" ] \
            || { echo "::error::Downloaded rollback bootstrap differs from the approved inventory"; exit 1; }
      - name: Move the stable bootstrap and pointer
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for the Ceal release origin"; exit 1; }
          done
          npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
            "$CEAL_RELEASE_BUCKET/releases/worker/stable/install-ceal.sh" \
            --file "stable/install-ceal.sh" --remote --cache-control "no-cache, max-age=0"
          curl --fail --silent --show-error --location \
            "$CEAL_RELEASE_ORIGIN/worker/stable/install-ceal.sh?readback=${GITHUB_SHA}-${RANDOM}" \
            --output "stable/install-ceal-readback.sh"
          cmp "stable/install-ceal.sh" "stable/install-ceal-readback.sh"
          npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
            "$CEAL_RELEASE_BUCKET/releases/worker/stable/ceal-worker-stable-release.json" \
            --file "stable/ceal-worker-stable-release.json" --remote --cache-control "no-cache, max-age=0"
          curl --fail --silent --show-error --location \
            "$CEAL_RELEASE_ORIGIN/worker/stable/ceal-worker-stable-release.json?readback=${GITHUB_SHA}-${RANDOM}" \
            --output "stable/ceal-worker-stable-release-readback.json"
          cmp "stable/ceal-worker-stable-release.json" "stable/ceal-worker-stable-release-readback.json"
          {
            echo "## Ceal worker stable rollback evidence"
            echo
            echo "- selected immutable tag: $TAG"
            echo "- public SHA256SUMS inventory: verified"
            echo "- public OIDC signatures: verified"
            echo "- stable pointer: moved after immutable public proof"
          } >> "$GITHUB_STEP_SUMMARY"
