name: Ceal worker release

# Worker-only release lane. The dual cealctl lane in cealctl-release.yml stays
# frozen compatibility material; this workflow signs and publishes exactly the
# worker asset inventory that install-ceal.sh verifies to the Ceal release
# origin. GitHub supplies source and OIDC signing identity, never release
# artifact storage or the stable channel resolver.
#
# The tag push is the stable-release approval: only maintainers can push
# ceal-v* tags in this repository. The immutable versioned object set is fully
# read back and verified before one mutable stable pointer is advanced.

on:
  push:
    tags:
      - "ceal-v*.*.*"

permissions: {}

# Versioned objects are create-or-identical within this sole writer lane. The
# group prevents two tag jobs from racing the public-404 -> first-write window;
# stable movement has its own explicit rollback workflow.
concurrency:
  group: ceal-worker-release-origin
  cancel-in-progress: false

env:
  HANDOFF_RELEASE_TAG: gateway-handoff-v0.65.0
  HANDOFF_ARCHIVE: ceal-gateway-handoff-0.65.0.tar.gz
  CEAL_RELEASE_ORIGIN: https://ceal.borca.ai/releases
  CEAL_RELEASE_BUCKET: ceal-release
  GATEWAY_HANDOFF_ORIGIN: https://ceal.borca.ai/releases/gateway-handoff

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-amd64
            runner: ubuntu-24.04
          # darwin runners are intentionally disabled (operator decision,
          # 2026-07-24): macOS artifacts are built manually from a Mac checkout
          # to avoid runner cost until the lane stabilizes. Re-enable with:
          # - platform: darwin-arm64
          #   runner: macos-15
          # - platform: darwin-amd64
          #   runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prewarm the offline packed-consumer cache
        run: node scripts/prewarm-offline-consumer-cache.mjs
      - name: Build and test source
        run: npm run check
      - name: Download the locked Gateway handoff archive
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/gateway-handoff"
          curl --fail --silent --show-error --location \
            "$GATEWAY_HANDOFF_ORIGIN/$HANDOFF_RELEASE_TAG/$HANDOFF_ARCHIVE" \
            --output "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE"
          expected="$(node -p 'JSON.parse(require("node:fs").readFileSync("gateway-handoff-lock.json","utf8")).archive.sha256')"
          observed="$(sha256sum "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE" | cut -d' ' -f1)"
          [ "$expected" = "$observed" ] \
            || { echo "Gateway handoff archive does not match gateway-handoff-lock.json" >&2; exit 1; }
      - name: Compose the checked worker asset set twice
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          version="${TAG#ceal-v}"
          for output in dist-a dist-b; do
            node scripts/build-worker-release-assets.mjs compose \
              --out "$RUNNER_TEMP/$output" \
              --gateway-handoff-archive "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE" \
              --version "$version" \
              --platform "$PLATFORM" \
              --json
          done
          for asset in \
            "ceal-$PLATFORM" \
            "ceal-worker-release-manifest-$PLATFORM.json" \
            ceal-guide-SKILL.md THIRD_PARTY_NOTICES.txt install-ceal.sh SHA256SUMS
          do
            cmp "$RUNNER_TEMP/dist-a/$asset" "$RUNNER_TEMP/dist-b/$asset"
          done
      - name: Preserve exact unprivileged build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/dist-a/

  assemble:
    needs: build
    permissions:
      contents: read
    outputs:
      sha256sums_sha256: ${{ steps.release-set.outputs.sha256sums_sha256 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact tag for merge tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download exact arm64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-linux-arm64
          path: handoff/linux-arm64
      - name: Download exact amd64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-linux-amd64
          path: handoff/linux-amd64
      - name: Merge one worker release inventory
        id: release-set
        run: |
          set -eu
          node scripts/build-worker-release-assets.mjs merge \
            --out "$RUNNER_TEMP/dist" \
            --input "$PWD/handoff/linux-arm64" \
            --input "$PWD/handoff/linux-amd64" \
            --json
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
          digest="$(sha256sum "$RUNNER_TEMP/dist/SHA256SUMS" | cut -d' ' -f1)"
          echo "sha256sums_sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Unprivileged worker release handoff"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- SHA256SUMS digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact unprivileged worker release handoff
        # include-hidden-files stays off on purpose: dropping the composed-set
        # marker here is what keeps it out of the published asset inventory.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/dist/

  sign-and-publish:
    needs: assemble
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CEAL_RELEASE_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CEAL_RELEASE_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Download exact assembled release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}
          path: dist
      - name: Verify the assembled worker inventory
        env:
          ASSEMBLED_SHA256SUMS_SHA256: ${{ needs.assemble.outputs.sha256sums_sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          observed="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          [ -n "$ASSEMBLED_SHA256SUMS_SHA256" ] && [ "$ASSEMBLED_SHA256SUMS_SHA256" = "$observed" ] \
            || { echo "Downloaded handoff does not match unprivileged assembly" >&2; exit 1; }
          [ "$(find dist -maxdepth 1 -type f -not -name '.*' -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "SHA256SUMS THIRD_PARTY_NOTICES.txt ceal-guide-SKILL.md ceal-linux-amd64 ceal-linux-arm64 ceal-worker-release-manifest-linux-amd64.json ceal-worker-release-manifest-linux-arm64.json install-ceal.sh " ] \
            || { echo "Unexpected worker release inventory" >&2; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          for platform in linux-arm64 linux-amd64; do
            manifest="dist/ceal-worker-release-manifest-$platform.json"
            grep -F "\"version\": \"${TAG#ceal-v}\"" "$manifest" >/dev/null
            grep -F "\"platform\": \"$platform\"" "$manifest" >/dev/null
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign, publish, and activate one exact stable worker release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^ceal-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Worker release tags must be canonical ceal-vMAJOR.MINOR.PATCH"; exit 1; }
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for the Ceal release origin"; exit 1; }
          done
          primary=(
            ceal-linux-arm64 ceal-linux-amd64
            ceal-worker-release-manifest-linux-arm64.json
            ceal-worker-release-manifest-linux-amd64.json
            ceal-guide-SKILL.md THIRD_PARTY_NOTICES.txt SHA256SUMS install-ceal.sh
          )
          expected=()
          for asset in "${primary[@]}"; do
            expected+=("$asset" "$asset.pem" "$asset.sig")
          done
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          for asset in "${primary[@]}"; do
            cosign sign-blob --yes \
              --output-signature "dist/$asset.sig" \
              --output-certificate "dist/$asset.pem" \
              "dist/$asset"
          done

          version_prefix="releases/worker/$TAG"
          version_url="$CEAL_RELEASE_ORIGIN/worker/$TAG"
          readback_dir="$RUNNER_TEMP/ceal-worker-release-readback"
          mkdir -p "$readback_dir"
          fetch_public() {
            local url="$1"
            local output="$2"
            local http_code
            http_code="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "${url}?readback=${GITHUB_SHA}-${RANDOM}")"
            printf '%s' "$http_code"
          }
          put_immutable() {
            local name="$1"
            local source="dist/$name"
            local deployed="$readback_dir/$name"
            local http_code
            http_code="$(fetch_public "$version_url/$name" "$deployed")"
            case "$http_code" in
              200) cmp "$source" "$deployed" ;;
              404)
                npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
                  "$CEAL_RELEASE_BUCKET/$version_prefix/$name" --file "$source" --remote \
                  --cache-control "public, max-age=31536000, immutable"
                http_code="$(fetch_public "$version_url/$name" "$deployed")"
                [ "$http_code" = 200 ] || { echo "::error::Expected public readback for $name, got HTTP $http_code"; exit 1; }
                cmp "$source" "$deployed"
                ;;
              *) echo "::error::Unexpected immutable object readback HTTP $http_code for $name"; exit 1 ;;
            esac
          }
          for name in "${expected_sorted[@]}"; do
            put_immutable "$name"
          done
          mapfile -t observed < <(find "$readback_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${observed[@]}")
          identity="https://github.com/corca-ai/ceal-cli/.github/workflows/ceal-release.yml@refs/tags/$TAG"
          for asset in "${primary[@]}"; do
            cmp "dist/$asset" "$readback_dir/$asset"
            cosign verify-blob \
              --certificate "$readback_dir/$asset.pem" \
              --signature "$readback_dir/$asset.sig" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "corca-ai/ceal-cli" \
              --certificate-github-workflow-ref "refs/tags/$TAG" \
              "$readback_dir/$asset" >/dev/null
          done

          stable_dir="$RUNNER_TEMP/ceal-worker-stable"
          mkdir -p "$stable_dir"
          cp dist/install-ceal.sh "$stable_dir/install-ceal.sh"
          release_set_sha="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          printf '{"schema_version":"ceal.worker_stable_release.v1","tag":"%s","sha256sums_sha256":"%s"}\n' "$TAG" "$release_set_sha" > "$stable_dir/ceal-worker-stable-release.json"
          stable_url="$CEAL_RELEASE_ORIGIN/worker/stable"
          stable_readback="$RUNNER_TEMP/ceal-worker-stable-readback"
          mkdir -p "$stable_readback"
          current_pointer="$stable_readback/current-pointer.json"
          current_status="$(fetch_public "$stable_url/ceal-worker-stable-release.json" "$current_pointer")"
          case "$current_status" in
            200)
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const pointer = JSON.parse(readFileSync(process.argv[1], "utf8"));
                const current = pointer?.tag;
                const target = process.argv[2];
                if (pointer?.schema_version !== "ceal.worker_stable_release.v1" || !/^[a-f0-9]{64}$/.test(pointer?.sha256sums_sha256 ?? "")) throw new Error("existing stable pointer is invalid");
                const parse = (tag) => {
                  const match = /^ceal-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(tag);
                  if (!match) throw new Error("existing stable pointer is invalid");
                  return match.slice(1).map(Number);
                };
                const left = parse(current); const right = parse(target);
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] > right[index]) throw new Error("refusing to downgrade stable worker pointer");
                  if (left[index] < right[index]) process.exit(0);
                }
              ' "$current_pointer" "$TAG"
              ;;
            404) ;;
            *) echo "::error::Unexpected stable pointer readback HTTP $current_status"; exit 1 ;;
          esac
          npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
            "$CEAL_RELEASE_BUCKET/releases/worker/stable/install-ceal.sh" \
            --file "$stable_dir/install-ceal.sh" --remote --cache-control "no-cache, max-age=0"
          bootstrap_status="$(fetch_public "$stable_url/install-ceal.sh" "$stable_readback/install-ceal.sh")"
          [ "$bootstrap_status" = 200 ] || { echo "::error::Expected stable installer readback, got HTTP $bootstrap_status"; exit 1; }
          cmp "$stable_dir/install-ceal.sh" "$stable_readback/install-ceal.sh"
          npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
            "$CEAL_RELEASE_BUCKET/releases/worker/stable/ceal-worker-stable-release.json" \
            --file "$stable_dir/ceal-worker-stable-release.json" --remote --cache-control "no-cache, max-age=0"
          pointer_status="$(fetch_public "$stable_url/ceal-worker-stable-release.json" "$stable_readback/ceal-worker-stable-release.json")"
          [ "$pointer_status" = 200 ] || { echo "::error::Expected stable pointer readback, got HTTP $pointer_status"; exit 1; }
          cmp "$stable_dir/ceal-worker-stable-release.json" "$stable_readback/ceal-worker-stable-release.json"
          {
            echo "## Ceal worker release evidence"
            echo
            echo "- tag: $TAG"
            echo "- commit/workflow source: $GITHUB_SHA"
            echo "- approved SHA256SUMS digest: $(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
            echo "- remote primary bytes: exact local match"
            echo "- remote signature identity: verified"
            echo "- stable signed-inventory pointer: advanced after immutable artifact verification"
          } >> "$GITHUB_STEP_SUMMARY"
