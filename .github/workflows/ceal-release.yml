name: Ceal worker release

# Worker-only release lane. The dual cealctl lane in cealctl-release.yml stays
# frozen compatibility material; this workflow signs and publishes exactly the
# worker asset inventory that install-ceal.sh verifies.
#
# The tag push is the release approval: only maintainers can push ceal-v* tags
# in this repository. Releases are created as prereleases; promoting one to the
# stable lane (`ceal update` / CEAL_VERSION=stable) is a separate operator edit.

on:
  push:
    tags:
      - "ceal-v*.*.*"

permissions: {}

env:
  HANDOFF_RELEASE_TAG: gateway-handoff-v0.65.0
  HANDOFF_ARCHIVE: ceal-gateway-handoff-0.65.0.tar.gz

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-amd64
            runner: ubuntu-24.04
          # darwin runners are intentionally disabled (operator decision,
          # 2026-07-24): macOS artifacts are built manually from a Mac checkout
          # to avoid runner cost until the lane stabilizes. Re-enable with:
          # - platform: darwin-arm64
          #   runner: macos-15
          # - platform: darwin-amd64
          #   runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test source
        run: npm run check
      - name: Download the locked Gateway handoff archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/gateway-handoff"
          gh release download "$HANDOFF_RELEASE_TAG" --repo "$GH_REPO" \
            --pattern "$HANDOFF_ARCHIVE" --dir "$RUNNER_TEMP/gateway-handoff"
          expected="$(node -p 'JSON.parse(require("node:fs").readFileSync("gateway-handoff-lock.json","utf8")).archive.sha256')"
          observed="$(sha256sum "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE" | cut -d' ' -f1)"
          [ "$expected" = "$observed" ] \
            || { echo "Gateway handoff archive does not match gateway-handoff-lock.json" >&2; exit 1; }
      - name: Compose the checked worker asset set twice
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          version="${TAG#ceal-v}"
          for output in dist-a dist-b; do
            node scripts/build-worker-release-assets.mjs compose \
              --out "$RUNNER_TEMP/$output" \
              --gateway-handoff-archive "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE" \
              --version "$version" \
              --platform "$PLATFORM" \
              --json
          done
          for asset in \
            "ceal-$PLATFORM" \
            "ceal-worker-release-manifest-$PLATFORM.json" \
            ceal-guide-SKILL.md THIRD_PARTY_NOTICES.txt install-ceal.sh SHA256SUMS
          do
            cmp "$RUNNER_TEMP/dist-a/$asset" "$RUNNER_TEMP/dist-b/$asset"
          done
      - name: Preserve exact unprivileged build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/dist-a/

  assemble:
    needs: build
    permissions:
      contents: read
    outputs:
      sha256sums_sha256: ${{ steps.release-set.outputs.sha256sums_sha256 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact tag for merge tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download exact arm64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-linux-arm64
          path: handoff/linux-arm64
      - name: Download exact amd64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-linux-amd64
          path: handoff/linux-amd64
      - name: Merge one worker release inventory
        id: release-set
        run: |
          set -eu
          node scripts/build-worker-release-assets.mjs merge \
            --out "$RUNNER_TEMP/dist" \
            --input "$PWD/handoff/linux-arm64" \
            --input "$PWD/handoff/linux-amd64" \
            --json
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
          digest="$(sha256sum "$RUNNER_TEMP/dist/SHA256SUMS" | cut -d' ' -f1)"
          echo "sha256sums_sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Unprivileged worker release handoff"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- SHA256SUMS digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact unprivileged worker release handoff
        # include-hidden-files stays off on purpose: dropping the composed-set
        # marker here is what keeps it out of the published asset inventory.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/dist/

  sign-and-publish:
    needs: assemble
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact assembled release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}
          path: dist
      - name: Verify the assembled worker inventory
        env:
          ASSEMBLED_SHA256SUMS_SHA256: ${{ needs.assemble.outputs.sha256sums_sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          observed="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          [ -n "$ASSEMBLED_SHA256SUMS_SHA256" ] && [ "$ASSEMBLED_SHA256SUMS_SHA256" = "$observed" ] \
            || { echo "Downloaded handoff does not match unprivileged assembly" >&2; exit 1; }
          [ "$(find dist -maxdepth 1 -type f -not -name '.*' -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "SHA256SUMS THIRD_PARTY_NOTICES.txt ceal-guide-SKILL.md ceal-linux-amd64 ceal-linux-arm64 ceal-worker-release-manifest-linux-amd64.json ceal-worker-release-manifest-linux-arm64.json install-ceal.sh " ] \
            || { echo "Unexpected worker release inventory" >&2; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          for platform in linux-arm64 linux-amd64; do
            manifest="dist/ceal-worker-release-manifest-$platform.json"
            grep -F "\"version\": \"${TAG#ceal-v}\"" "$manifest" >/dev/null
            grep -F "\"platform\": \"$platform\"" "$manifest" >/dev/null
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign and publish one exact worker prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          primary=(
            ceal-linux-arm64 ceal-linux-amd64
            ceal-worker-release-manifest-linux-arm64.json
            ceal-worker-release-manifest-linux-amd64.json
            ceal-guide-SKILL.md THIRD_PARTY_NOTICES.txt SHA256SUMS install-ceal.sh
          )
          expected=()
          for asset in "${primary[@]}"; do
            expected+=("$asset" "$asset.pem" "$asset.sig")
          done
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --repo "$GH_REPO" --json isPrerelease --jq .isPrerelease)" = true ] \
              || { echo "Existing release is not a prerelease; refusing to mutate a promoted release" >&2; exit 1; }
          else
            gh release create "$TAG" --repo "$GH_REPO" --prerelease --verify-tag \
              --title "Ceal worker $TAG" \
              --notes "Worker-only signed release. Install with install-ceal.sh (CEAL_VERSION=$TAG). This lane supersedes the legacy dual v* releases for worker installs; no npm publication, Gateway change, or provider action is part of this release."
          fi

          existing_inventory="$(mktemp)"
          gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' > "$existing_inventory"
          mapfile -t existing < <(sort "$existing_inventory")
          if [ "${#existing[@]}" -gt 0 ]; then
            if ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${existing[@]}"); then
              echo "Release asset inventory is partial or unexpected; delete and recreate the prerelease after review, then rerun." >&2
              exit 1
            fi
          else
            for asset in "${primary[@]}"; do
              cosign sign-blob --yes \
                --output-signature "dist/$asset.sig" \
                --output-certificate "dist/$asset.pem" \
                "dist/$asset"
            done
            gh release upload "$TAG" --repo "$GH_REPO" dist/*
          fi

          rm -rf readback
          mkdir readback
          gh release download "$TAG" --repo "$GH_REPO" --dir readback
          mapfile -t observed < <(find readback -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${observed[@]}")
          identity="https://github.com/$GH_REPO/.github/workflows/ceal-release.yml@refs/tags/$TAG"
          for asset in "${primary[@]}"; do
            cmp "dist/$asset" "readback/$asset"
            cosign verify-blob \
              --certificate "readback/$asset.pem" \
              --signature "readback/$asset.sig" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "$GH_REPO" \
              --certificate-github-workflow-ref "refs/tags/$TAG" \
              "readback/$asset" >/dev/null
          done
          {
            echo "## Ceal worker release evidence"
            echo
            echo "- tag: $TAG"
            echo "- commit/workflow source: $GITHUB_SHA"
            echo "- approved SHA256SUMS digest: $(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
            echo "- remote primary bytes: exact local match"
            echo "- remote signature identity: verified"
          } >> "$GITHUB_STEP_SUMMARY"
