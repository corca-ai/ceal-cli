name: Ceal worker release

# The release lane. It signs and publishes exactly the worker asset inventory
# that install-ceal.sh verifies, to the Ceal release origin. The dual cealctl
# lane that used to sit beside this one is deleted; corca-ai/ceal owns that
# release path now. GitHub supplies source and OIDC signing identity, never release
# artifact storage or the stable channel resolver.
#
# A tag push selects a candidate; it is not sufficient approval by itself.
# The privileged job also requires the `ceal-cli-release` Environment, which the
# operator must protect before release, and its exact approved commit/inventory
# digest. The immutable versioned object set is fully read back and verified
# before the stable bootstrap and pointer advance.
#
# `workflow_dispatch` is a DRY RUN and can never publish. It exists because a
# release tag cannot be reused, so before this trigger the first execution of any
# change to this file was a real tag — the change either worked or burned the
# tag. A dispatch builds, composes, and verifies exactly what a tag would, then
# stops: the two jobs that sign, upload, and move the stable pointer are gated on
# the push event, and a dispatch reaches neither. It shares the writer lane's
# concurrency group on purpose, so a dry run and a real release cannot interleave
# against the same origin.

on:
  push:
    tags:
      - "ceal-v*.*.*"
  workflow_dispatch:

permissions: {}

# Versioned objects are create-or-identical within this sole writer lane. The
# group prevents two tag jobs from racing the public-404 -> first-write window;
# stable movement has its own explicit rollback workflow.
concurrency:
  group: ceal-worker-release-origin
  cancel-in-progress: false

env:
  # These two must name the archive gateway-protocol-handoff-lock.json binds. They are
  # literals because the job needs them before any checkout step could read the
  # lock, and a mismatch is not a soft failure: the download succeeds, the digest
  # comparison below fails, and the tag is burned and cannot be reused. The
  # contract tier pins them against the lock for exactly that reason.
  HANDOFF_RELEASE_TAG: gateway-protocol-handoff-v0.72.21
  HANDOFF_ARCHIVE: ceal-gateway-protocol-handoff-0.72.21.tar.gz
  CEAL_RELEASE_ORIGIN: https://ceal.borca.ai/releases
  CEAL_RELEASE_BUCKET: ceal-release
  GATEWAY_HANDOFF_ORIGIN: https://ceal.borca.ai/releases/gateway-protocol-handoff

jobs:
  build:
    permissions:
      contents: read
    # A tag cannot be reused, so a wedged release job is worse than a failed
    # one: holding a runner for the 6-hour default means the burned tag is
    # discovered hours after the cause stopped being obvious. These bounds are
    # the gate's own 30 minutes plus the native build and asset composition
    # this job does on top of it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            validate_source: "0"
          - platform: linux-amd64
            runner: ubuntu-24.04
            validate_source: "1"
          # darwin-arm64 is the only supported macOS install path: a signed
          # release is required because
          # install-ceal.sh verifies every asset against its tag-bound OIDC
          # signing identity and has no unsigned bypass. A manual Mac build
          # cannot carry that identity. Every job below that names a platform
          # must name all three; the merge tooling is already platform-generic.
          - platform: darwin-arm64
            runner: macos-15
            validate_source: "1"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Unconditional now that every leg runs a packed-consumer proof. The
      # `linux-arm64` leg reaches it through the release tier below rather than
      # the gate, and without the cache those proofs fail as `ENOTCACHED`.
      - name: Prewarm the offline packed-consumer cache
        run: node scripts/prewarm-offline-consumer-cache.mjs
      # The gate is the same one check.yml runs, so it must be asked for the
      # same proofs. Without this the linux runners silently skip the
      # release-artifact and installer proofs, and the release lane — the one
      # place those proofs describe — is the weaker of the two gates.
      #
      # `linux-amd64` exactly, not `linux-*`. The proofs build a SEA and run an
      # installer for PLATFORM_PROOF_PLATFORM (`linux-x64`), so on the
      # `linux-arm64` leg they cannot run at all and the flag converts a correct
      # skip into a hard failure. That is what burned ceal-v0.67.0: the flag
      # landed after ceal-v0.66.1, so v0.67.0 was the first release to run it,
      # and no check.yml leg is arm64 so nothing else could have caught it.
      #
      # `validate_source` runs this once per architecture family rather than
      # once per platform. The source is identical on all three legs, so two of
      # the three runs were re-proving the same commit; the two that remain are
      # the one that can run the platform proofs (`linux-amd64`) and one macOS
      # leg, so a macOS-only source break still fails before anything is signed.
      #
      # This does not weaken what the skipped legs prove about themselves. The
      # composition below is self-sufficient: it stages an isolated consumer and
      # runs its own `tsc` (scripts/build-worker-release-package.mjs), then
      # builds the SEA and runs its native smoke test. A leg that skips the gate
      # still compiles, links, and executes its own binary.
      - name: Build and test source
        if: matrix.validate_source == '1'
        run: npm run check
        env:
          CEAL_REQUIRE_PLATFORM_PROOFS: ${{ matrix.platform == 'linux-amd64' && '1' || '0' }}
      # The one proof the paragraph above cannot hand a skipped leg. Everything
      # it argues is architecture-independent — lint, unit, contract — is about
      # the SOURCE, and this tier is not: `verifyGatewayProtocolConsumer` proves
      # npm's resolver on THIS runner binds the packed Gateway tarball rather
      # than the workspace symlink development creates, and those two are
      # indistinguishable from a passing build. Without it the signed arm64
      # binary is the one artifact never asked that question. The 2026-08-08
      # lockfile incident is the same axis: npm recorded only the optional
      # platform packages matching the host it resolved on.
      #
      # `npm run build` first because the tier reads `dist/`, and platform
      # proofs stay off: they build a `linux-x64` SEA and cannot run here.
      - name: Prove the packed Gateway consumer on the ungated leg
        if: matrix.validate_source == '0'
        run: npm run build && npm run test:release
        env:
          CEAL_REQUIRE_PLATFORM_PROOFS: "0"
      - name: Download the locked Gateway handoff archive
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/gateway-handoff"
          # Retried for the same reason as the readback below: a transient fetch
          # failure here burns a tag that cannot be reused.
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-connrefused \
            "$GATEWAY_HANDOFF_ORIGIN/$HANDOFF_RELEASE_TAG/$HANDOFF_ARCHIVE" \
            --output "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE"
          expected="$(node -p 'JSON.parse(require("node:fs").readFileSync("gateway-protocol-handoff-lock.json","utf8")).archive.sha256')"
          # This job also runs on macOS runners, which ship no GNU sha256sum;
          # node is already installed above and is the portable digest source.
          observed="$(node -p 'require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex")' "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE")"
          [ "$expected" = "$observed" ] \
            || { echo "Gateway handoff archive does not match gateway-protocol-handoff-lock.json" >&2; exit 1; }
      - name: Compose the checked worker asset set twice
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          # On a tag the version is the tag, which is the identity the whole
          # release is bound to. A dispatch has no tag — `github.ref_name` is the
          # branch — so it composes against the repository's own version instead.
          # That output is never published, and deriving it from the branch name
          # would fail the composer's semver check for no reason.
          if [ "$EVENT" = push ]; then
            version="${TAG#ceal-v}"
          else
            version="$(node -p 'require("./package.json").version')"
          fi
          for output in dist-a dist-b; do
            node scripts/build-worker-release-assets.mjs compose \
              --out "$RUNNER_TEMP/$output" \
              --gateway-handoff-archive "$RUNNER_TEMP/gateway-handoff/$HANDOFF_ARCHIVE" \
              --version "$version" \
              --platform "$PLATFORM" \
              --json
          done
          for asset in \
            "ceal-$PLATFORM" \
            "ceal-worker-release-manifest-$PLATFORM.json" \
            ceal-guide-SKILL.md THIRD_PARTY_NOTICES.txt install-ceal.sh SHA256SUMS
          do
            cmp "$RUNNER_TEMP/dist-a/$asset" "$RUNNER_TEMP/dist-b/$asset"
          done
      - name: Preserve exact unprivileged build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/dist-a/

  assemble:
    needs: build
    # The dry run reaches this job too. It used to stop at `build` on the reading
    # that "everything from here down writes to the release origin" — true of
    # `sign-and-publish`, which holds the signing identity and the origin
    # credentials, and not true of this job, which downloads build artifacts,
    # merges them locally, and uploads one artifact. It has `contents: read` and
    # no secrets, so there is nothing here for a dispatch to damage.
    #
    # What that reading cost: the merge is where the pre-signing protocol-pin
    # assertion runs, so the first execution of any change to it was a real tag —
    # the exact hazard `workflow_dispatch` was added to remove, left in place for
    # half the lane. `sign-and-publish` still keeps its own `push` condition.
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      sha256sums_sha256: ${{ steps.release-set.outputs.sha256sums_sha256 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact tag for merge tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # One named download per signed_release_platforms entry. Each is required:
      # a missing platform artifact fails this job instead of silently
      # publishing a partial inventory.
      - name: Download exact linux-arm64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-linux-arm64
          path: handoff/linux-arm64
      - name: Download exact linux-amd64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-linux-amd64
          path: handoff/linux-amd64
      - name: Download exact darwin-arm64 build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}-darwin-arm64
          path: handoff/darwin-arm64
      - name: Merge one worker release inventory
        id: release-set
        run: |
          set -euo pipefail
          node scripts/build-worker-release-assets.mjs merge \
            --out "$RUNNER_TEMP/dist" \
            --input "$PWD/handoff/linux-arm64" \
            --input "$PWD/handoff/linux-amd64" \
            --input "$PWD/handoff/darwin-arm64" \
            --json
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
          digest="$(sha256sum "$RUNNER_TEMP/dist/SHA256SUMS" | cut -d' ' -f1)"
          echo "sha256sums_sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Unprivileged worker release handoff"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- SHA256SUMS digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact unprivileged worker release handoff
        # include-hidden-files stays off on purpose: dropping the composed-set
        # marker here is what keeps it out of the published asset inventory.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/dist/

  sign-and-publish:
    needs: assemble
    # Stated again rather than inherited through `needs`: a skipped dependency
    # already prevents this job, but the signing identity and the origin
    # credentials are named here, and the condition that keeps a dispatch away
    # from them belongs next to them.
    if: github.event_name == 'push'
    environment: ceal-cli-release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CEAL_ENV_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CEAL_ENV_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require approved worker release identity
        env:
          APPROVED_COMMIT: ${{ vars.CEAL_CLI_APPROVED_COMMIT }}
          APPROVED_SHA256SUMS_SHA256: ${{ vars.CEAL_CLI_APPROVED_SHA256SUMS_SHA256 }}
          ASSEMBLED_SHA256SUMS_SHA256: ${{ needs.assemble.outputs.sha256sums_sha256 }}
        run: |
          set -euo pipefail
          [ -n "$APPROVED_COMMIT" ] && [ "$APPROVED_COMMIT" = "$GITHUB_SHA" ] \
            || { echo "::error::ceal-cli-release has not approved commit $GITHUB_SHA"; exit 1; }
          [ -n "$APPROVED_SHA256SUMS_SHA256" ] \
            && [ "$APPROVED_SHA256SUMS_SHA256" = "$ASSEMBLED_SHA256SUMS_SHA256" ] \
            || { echo "::error::ceal-cli-release has not approved the assembled SHA256SUMS"; exit 1; }
      - name: Download exact assembled release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ceal-worker-release-${{ github.sha }}
          path: dist
      - name: Verify the assembled worker inventory
        env:
          APPROVED_COMMIT: ${{ vars.CEAL_CLI_APPROVED_COMMIT }}
          APPROVED_SHA256SUMS_SHA256: ${{ vars.CEAL_CLI_APPROVED_SHA256SUMS_SHA256 }}
          ASSEMBLED_SHA256SUMS_SHA256: ${{ needs.assemble.outputs.sha256sums_sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          observed="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          [ -n "$APPROVED_SHA256SUMS_SHA256" ] && [ "$APPROVED_SHA256SUMS_SHA256" = "$observed" ] \
            || { echo "::error::ceal-cli-release has not approved SHA256SUMS $observed"; exit 1; }
          [ -n "$ASSEMBLED_SHA256SUMS_SHA256" ] && [ "$ASSEMBLED_SHA256SUMS_SHA256" = "$observed" ] \
            || { echo "Downloaded handoff does not match unprivileged assembly" >&2; exit 1; }
          [ "$(find dist -maxdepth 1 -type f -not -name '.*' -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "SHA256SUMS THIRD_PARTY_NOTICES.txt ceal-darwin-arm64 ceal-guide-SKILL.md ceal-linux-amd64 ceal-linux-arm64 ceal-worker-release-manifest-darwin-arm64.json ceal-worker-release-manifest-linux-amd64.json ceal-worker-release-manifest-linux-arm64.json install-ceal.sh " ] \
            || { echo "Unexpected worker release inventory" >&2; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          for platform in linux-arm64 linux-amd64 darwin-arm64; do
            manifest="dist/ceal-worker-release-manifest-$platform.json"
            grep -F "\"version\": \"${TAG#ceal-v}\"" "$manifest" >/dev/null
            grep -F "\"platform\": \"$platform\"" "$manifest" >/dev/null
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign, publish, and activate one exact stable worker release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^ceal-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Worker release tags must be canonical ceal-vMAJOR.MINOR.PATCH"; exit 1; }
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for the Ceal release origin"; exit 1; }
          done
          primary=(
            ceal-linux-arm64 ceal-linux-amd64 ceal-darwin-arm64
            ceal-worker-release-manifest-linux-arm64.json
            ceal-worker-release-manifest-linux-amd64.json
            ceal-worker-release-manifest-darwin-arm64.json
            ceal-guide-SKILL.md THIRD_PARTY_NOTICES.txt SHA256SUMS install-ceal.sh
          )
          expected=()
          for asset in "${primary[@]}"; do
            expected+=("$asset" "$asset.pem" "$asset.sig")
          done
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          for asset in "${primary[@]}"; do
            cosign sign-blob --yes \
              --output-signature "dist/$asset.sig" \
              --output-certificate "dist/$asset.pem" \
              "dist/$asset"
          done

          version_prefix="releases/worker/$TAG"
          version_url="$CEAL_RELEASE_ORIGIN/worker/$TAG"
          readback_dir="$RUNNER_TEMP/ceal-worker-release-readback"
          mkdir -p "$readback_dir"
          # A tag that fails here cannot be reused, and 0.65.8 died to a readback
          # that a couple of retries would have survived. A transport failure or
          # a 5xx from the edge is not evidence about the release, so retry it;
          # a 404 is real information (the object is not there yet) and returns
          # immediately so put_immutable can upload.
          fetch_public() {
            local url="$1"
            local output="$2"
            local http_code=000
            local attempt
            for attempt in 1 2 3 4 5; do
              http_code="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "${url}?readback=${GITHUB_SHA}-${RANDOM}")" || http_code=000
              case "$http_code" in
                000|429|5[0-9][0-9]) ;;
                *) printf '%s' "$http_code"; return 0 ;;
              esac
              echo "::warning::Transient readback HTTP $http_code for $url (attempt $attempt/5); retrying"
              sleep "$(( attempt * 3 ))"
            done
            printf '%s' "$http_code"
          }
          # Object storage is not read-your-write here: a just-uploaded object can
          # answer 404 for a moment. Waiting for that is not the same as accepting
          # a missing object, so this exhausts its budget and then reports the last
          # code it saw rather than pretending it got one.
          await_public() {
            local url="$1"
            local output="$2"
            local http_code
            local attempt
            for attempt in 1 2 3 4 5 6; do
              http_code="$(fetch_public "$url" "$output")"
              [ "$http_code" = 200 ] && { printf '200'; return 0; }
              echo "::warning::Waiting for readback of $url (HTTP $http_code, attempt $attempt/6)"
              sleep "$(( attempt * 3 ))"
            done
            printf '%s' "$http_code"
          }
          put_immutable() {
            local name="$1"
            local source="dist/$name"
            local deployed="$readback_dir/$name"
            local http_code
            http_code="$(fetch_public "$version_url/$name" "$deployed")"
            case "$http_code" in
              200) cmp "$source" "$deployed" ;;
              404)
                npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
                  "$CEAL_RELEASE_BUCKET/$version_prefix/$name" --file "$source" --remote \
                  --cache-control "public, max-age=31536000, immutable"
                http_code="$(await_public "$version_url/$name" "$deployed")"
                [ "$http_code" = 200 ] || { echo "::error::Expected public readback for $name, got HTTP $http_code"; exit 1; }
                cmp "$source" "$deployed"
                ;;
              *) echo "::error::Unexpected immutable object readback HTTP $http_code for $name"; exit 1 ;;
            esac
          }
          for name in "${expected_sorted[@]}"; do
            put_immutable "$name"
          done
          mapfile -t observed < <(find "$readback_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${observed[@]}")
          identity="https://github.com/corca-ai/ceal-cli/.github/workflows/ceal-release.yml@refs/tags/$TAG"
          for asset in "${primary[@]}"; do
            cmp "dist/$asset" "$readback_dir/$asset"
            cosign verify-blob \
              --certificate "$readback_dir/$asset.pem" \
              --signature "$readback_dir/$asset.sig" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "corca-ai/ceal-cli" \
              --certificate-github-workflow-ref "refs/tags/$TAG" \
              "$readback_dir/$asset" >/dev/null
          done

          stable_dir="$RUNNER_TEMP/ceal-worker-stable"
          mkdir -p "$stable_dir"
          cp dist/install-ceal.sh "$stable_dir/install-ceal.sh"
          release_set_sha="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          printf '{"schema_version":"ceal.worker_stable_release.v1","tag":"%s","sha256sums_sha256":"%s"}\n' "$TAG" "$release_set_sha" > "$stable_dir/ceal-worker-stable-release.json"
          stable_url="$CEAL_RELEASE_ORIGIN/worker/stable"
          stable_readback="$RUNNER_TEMP/ceal-worker-stable-readback"
          mkdir -p "$stable_readback"
          current_pointer="$stable_readback/current-pointer.json"
          current_status="$(fetch_public "$stable_url/ceal-worker-stable-release.json" "$current_pointer")"
          case "$current_status" in
            200)
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const pointer = JSON.parse(readFileSync(process.argv[1], "utf8"));
                const current = pointer?.tag;
                const target = process.argv[2];
                if (pointer?.schema_version !== "ceal.worker_stable_release.v1" || !/^[a-f0-9]{64}$/.test(pointer?.sha256sums_sha256 ?? "")) throw new Error("existing stable pointer is invalid");
                const parse = (tag) => {
                  const match = /^ceal-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(tag);
                  if (!match) throw new Error("existing stable pointer is invalid");
                  return match.slice(1).map(Number);
                };
                const left = parse(current); const right = parse(target);
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] > right[index]) throw new Error("refusing to downgrade stable worker pointer");
                  if (left[index] < right[index]) process.exit(0);
                }
              ' "$current_pointer" "$TAG"
              ;;
            404) ;;
            *) echo "::error::Unexpected stable pointer readback HTTP $current_status"; exit 1 ;;
          esac
          npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
            "$CEAL_RELEASE_BUCKET/releases/worker/stable/install-ceal.sh" \
            --file "$stable_dir/install-ceal.sh" --remote --cache-control "no-cache, max-age=0"
          bootstrap_status="$(await_public "$stable_url/install-ceal.sh" "$stable_readback/install-ceal.sh")"
          [ "$bootstrap_status" = 200 ] || { echo "::error::Expected stable installer readback, got HTTP $bootstrap_status"; exit 1; }
          cmp "$stable_dir/install-ceal.sh" "$stable_readback/install-ceal.sh"
          npm exec --yes --package=wrangler@4.99.0 -- wrangler r2 object put \
            "$CEAL_RELEASE_BUCKET/releases/worker/stable/ceal-worker-stable-release.json" \
            --file "$stable_dir/ceal-worker-stable-release.json" --remote --cache-control "no-cache, max-age=0"
          pointer_status="$(await_public "$stable_url/ceal-worker-stable-release.json" "$stable_readback/ceal-worker-stable-release.json")"
          [ "$pointer_status" = 200 ] || { echo "::error::Expected stable pointer readback, got HTTP $pointer_status"; exit 1; }
          cmp "$stable_dir/ceal-worker-stable-release.json" "$stable_readback/ceal-worker-stable-release.json"
          {
            echo "## Ceal worker release evidence"
            echo
            echo "- tag: $TAG"
            echo "- commit/workflow source: $GITHUB_SHA"
            echo "- approved SHA256SUMS digest: $(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
            echo "- remote primary bytes: exact local match"
            echo "- remote signature identity: verified"
            echo "- stable signed-inventory pointer: advanced after immutable artifact verification"
          } >> "$GITHUB_STEP_SUMMARY"
